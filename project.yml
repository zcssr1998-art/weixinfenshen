name: DualChatPoC
options:
  bundleIdPrefix: art.zcssr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  DualChatA:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Config/DualChatA-Info.plist
      properties:
        CFBundleDisplayName: "双开 A"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: art.zcssr.dualchat.a
            CFBundleURLSchemes:
              - dualchata
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.zcssr.dualchat.a
        PRODUCT_NAME: DualChatA
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false

  DualChatB:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Config/DualChatB-Info.plist
      properties:
        CFBundleDisplayName: "双开 B"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: art.zcssr.dualchat.b
            CFBundleURLSchemes:
              - dualchatb
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.zcssr.dualchat.b
        PRODUCT_NAME: DualChatB
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
